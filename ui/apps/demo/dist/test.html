<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MldongFlowDesignerPlus 演示</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>window.vue = window.Vue;</script>
  <script src="./mldong-flow-designer-dingtalk/lib/mldong-flow-designer-dingtalk.umd.cjs"></script>
  <link rel="stylesheet" crossorigin href="./mldong-flow-designer-dingtalk/lib/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; }
    .demo-header {
      height: 48px; padding: 0 16px; display: flex; align-items: center;
      background: #fff; border-bottom: 1px solid #e4e7ed; font-weight: 600;
    }
    .demo-body { display: flex; height: calc(100% - 48px); }
    .demo-canvas { flex: 1; min-width: 0; }
    .demo-side {
      width: 320px; background: #fff; border-left: 1px solid #e4e7ed;
      padding: 12px; overflow: auto; box-sizing: border-box;
    }
    .demo-side h3 { margin: 0 0 8px; font-size: 14px; }
    .demo-side pre {
      background: #f5f7fa; border: 1px solid #e4e7ed; border-radius: 4px;
      padding: 8px; font-size: 12px; max-height: calc(100% - 80px); overflow: auto;
      white-space: pre-wrap; word-break: break-all;
    }
    .demo-side .meta { color: #909399; font-size: 12px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="demo-header">MldongFlowDesignerPlus（钉钉风格）演示</div>
    <div class="demo-body">
      <div class="demo-canvas">
        <mldong-flow-designer-plus v-model:value="flowData"></mldong-flow-designer-plus>
      </div>
      <aside class="demo-side">
        <h3>画布数据（v-model）</h3>
        <div class="meta">节点 / 边 / 表单配置改动会实时回显。</div>
        <pre>{{ JSON.stringify(flowData, null, 2) }}</pre>
      </aside>
    </div>
  </div>
  <script>
    const { createApp, ref } = Vue;
    const app = createApp({
      setup() {
        const flowData = ref({});
        return { flowData };
      },
    });
    app.use(MldongFlowDesignerDingtalk);
    app.mount('#app');
  </script>
</body>
</html>
